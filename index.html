<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>راديو المغرب لايف — البث المباشر للإذاعات المغربية</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: rgba(18, 26, 47, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #2563eb;
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .navbar-glass {
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    .hero-banner {
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 70%);
      padding: 50px 0 30px 0;
      text-align: center;
    }

    .btn-filter, .btn-city-pill {
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 16px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: #94a3b8;
      transition: all 0.2s;
    }

    .btn-filter.active, .btn-city-pill.active, .btn-filter:hover, .btn-city-pill:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
    }

    .station-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: all 0.25s ease;
      position: relative;
    }

    .station-card:hover {
      border-color: rgba(37, 99, 235, 0.5);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .station-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--accent-gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 14px;
    }

    .station-play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .station-play-btn:hover {
      transform: scale(1.1);
      background: #1d4ed8;
    }

    /* Fixed Bottom Mini Player */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      z-index: 1000;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.6);
    }

    /* Equalizer animation */
    .equalizer-bar {
      display: inline-block;
      width: 3px;
      height: 14px;
      background: #10b981;
      margin: 0 1.5px;
      border-radius: 2px;
      animation: eq 1s infinite alternate;
    }
    @keyframes eq {
      0% { height: 4px; }
      100% { height: 18px; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
        <i class="fa-solid fa-radio text-primary fs-4"></i>
        <span>راديو المغرب لايف</span>
        <span class="badge bg-danger rounded-pill px-2 py-1 ms-1" style="font-size: 10px;" id="navLiveStatus">بث مباشر 24/7</span>
      </a>

      <div class="d-flex align-items-center gap-3">
        <a href="../../index.html#projects" class="btn btn-sm btn-outline-light rounded-pill px-3">
          <i class="fa-solid fa-arrow-right ms-1"></i> العودة للموقع
        </a>
      </div>
    </div>
  </nav>

  <!-- Hero & Search -->
  <header class="hero-banner">
    <div class="container">
      <h1 class="fw-bold mb-2">استمع لأقوى المحطات الإذاعية المغربية مباشرة</h1>
      <p class="text-secondary mb-4">بث صوتي عالي النقاء مستمر بدون انقطاع — موسيقى، أخبار، رياضة، قرآن وتراث</p>

      <!-- Search Bar -->
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="input-group input-group-lg shadow-sm">
            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="stationSearchInput" class="form-control bg-dark border-secondary border-opacity-25 text-white" placeholder="ابحث باسم الإذاعة، المدينة أو التردد...">
            <button id="btnClearSearch" class="btn btn-dark border-secondary border-opacity-25 text-secondary" type="button"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
      </div>

      <!-- Categories Filter -->
      <div class="d-flex flex-wrap justify-content-center gap-2 mt-4" id="categoryFilterBar">
        <button class="btn btn-filter active" data-filter="all">الكل (<span id="stationsCounter">24</span>)</button>
        <button class="btn btn-filter" data-filter="quran">القرآن الكريم</button>
        <button class="btn btn-filter" data-filter="news">أخبار وحوارات</button>
        <button class="btn btn-filter" data-filter="sports">رياضة ومباريات</button>
        <button class="btn btn-filter" data-filter="music">موسيقى وترفيه</button>
        <button class="btn btn-filter" data-filter="culture">ثقافة وتراث</button>
      </div>
    </div>
  </header>

  <!-- Stations Grid -->
  <main class="container my-5">
    <div id="stationsGrid" class="row g-4">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- Fixed Mini Player at Bottom -->
  <div class="mini-player" id="miniPlayer">
    <div class="container d-flex align-items-center justify-content-between">
      
      <!-- Current Station Info -->
      <div class="d-flex align-items-center gap-3">
        <div class="station-icon mb-0" style="width: 44px; height: 44px; font-size: 1.1rem;">
          <i class="fa-solid fa-tower-broadcast"></i>
        </div>
        <div>
          <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold fs-6 text-white" id="playerTitle">اختر إذاعة للبدء</h5>
            <span class="badge bg-success" style="font-size: 9px;" id="playerLiveBadge">LIVE</span>
          </div>
          <div class="text-secondary small" style="font-size: 11px;">
            <span id="playerSub">بث صوتي مباشر</span> · <span id="playerFreq">FM Online</span>
          </div>
        </div>
      </div>

      <!-- Main Controls -->
      <div class="d-flex align-items-center gap-3">
        <button class="station-play-btn" id="mainPlayBtn" title="تشغيل / إيقاف">
          <i class="fa-solid fa-play" id="mainPlayIcon"></i>
        </button>
      </div>

      <!-- Volume & Stats -->
      <div class="d-none d-md-flex align-items-center gap-3">
        <i class="fa-solid fa-volume-high text-secondary" id="volumeIcon"></i>
        <input type="range" class="form-range" id="playerVolumeSlider" min="0" max="100" value="80" style="width: 100px;">
        <span class="text-secondary small font-monospace" id="volumePercent">80%</span>
      </div>

    </div>
  </div>

  <!-- Audio Element -->
  <audio id="radioAudioPlayer" preload="none"></audio>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
